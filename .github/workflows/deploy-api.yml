name: Deploy MoneyAction API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/src/**'
      - 'backend/schema.sql'
      - 'backend/package.json'
      - 'backend/tsconfig.json'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: write

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY"; exit 1; }

      - name: Find or create D1 database
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON=$(curl -fsS -G \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-urlencode "name=money-action")

          DB_ID=$(printf '%s' "$LIST_JSON" | jq -r '.result[0].uuid // empty')
          if [ -z "$DB_ID" ]; then
            CREATE_JSON=$(curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"money-action","primary_location_hint":"apac"}')
            DB_ID=$(printf '%s' "$CREATE_JSON" | jq -r '.result.uuid // empty')
          fi

          test -n "$DB_ID" || { echo "Could not resolve D1 database ID"; exit 1; }
          export D1_DATABASE_ID="$DB_ID"
          echo "D1 database ready."
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('backend/wrangler.toml')
          text = path.read_text()
          db_id = os.environ['D1_DATABASE_ID']
          text, count = re.subn(r'database_id\s*=\s*"[^"]+"', f'database_id = "{db_id}"', text, count=1)
          if count != 1:
              raise SystemExit('Could not update D1 database_id in wrangler.toml')
          path.write_text(text)
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Apply D1 schema
        working-directory: backend
        run: npx wrangler d1 execute DB --remote --file=./schema.sql --yes

      - name: Deploy Worker
        id: deploy
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          WORKER_URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | tail -n 1 || true)
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Store Gemini key as Worker secret
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WORKER_URL:-}" ]; then
            echo "Worker deployed, but URL could not be parsed from Wrangler output."
            exit 1
          fi
          sleep 3
          curl -fsS "${WORKER_URL}/api/health" | tee /tmp/health.json
          echo
          jq -e '.ok == true and .version == "0.1.2"' /tmp/health.json >/dev/null
          echo "### MoneyAction API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: ${WORKER_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: money-action" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gemini model: gemini-3.5-flash-lite" >> "$GITHUB_STEP_SUMMARY"

      - name: Gemini plan smoke test
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='{"nickname":"SmokeTest","monthlyIncome":0,"targetIncome":500,"weeklyHours":5,"skills":["writing"],"interests":["content"],"experience":"beginner","locale":"en","market":"US","currency":"USD","timeZone":"America/New_York"}'
          HTTP_CODE=$(curl -sS -o /tmp/plan.json -w '%{http_code}' \
            -X POST "${WORKER_URL}/api/plan" \
            -H 'content-type: application/json' \
            -H "x-device-id: deploy-plan-smoke-${GITHUB_RUN_ID}" \
            --data "$PAYLOAD")
          cat /tmp/plan.json
          echo
          test "$HTTP_CODE" = "200" || { echo "Plan API returned HTTP $HTTP_CODE"; exit 1; }
          jq -e '.selectedPath.name | strings | length > 0' /tmp/plan.json >/dev/null
          jq -e '.alternatives | length == 2' /tmp/plan.json >/dev/null
          jq -e '.missions | length == 7' /tmp/plan.json >/dev/null
          jq -e '.missions[0].why | strings | length > 0' /tmp/plan.json >/dev/null
          jq -e '.missions[0].question | strings | length > 0' /tmp/plan.json >/dev/null
          jq -e '.missions[0].suggestions | length == 3' /tmp/plan.json >/dev/null
          jq -e '.missions[0].deliverable | strings | length > 0' /tmp/plan.json >/dev/null
          jq -e '.milestones | length == 3' /tmp/plan.json >/dev/null
          echo "Gemini plan generation passed."
          echo "- Gemini plan smoke test: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Interactive mission coaching smoke test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mission-payload.json <<'JSON'
          {
            "profile": {
              "nickname": "SmokeTest",
              "monthlyIncome": 0,
              "targetIncome": 500,
              "weeklyHours": 5,
              "skills": ["writing"],
              "interests": ["content"],
              "experience": "beginner",
              "locale": "en",
              "market": "US",
              "currency": "USD",
              "timeZone": "America/New_York"
            },
            "selectedPath": {
              "id": "content-service",
              "name": "Practical content service",
              "summary": "Create useful content for small businesses.",
              "fitScore": 88,
              "firstRevenueDays": 14,
              "priceIdea": "$50-$150 test offer",
              "reason": "Matches writing skills and limited weekly time."
            },
            "mission": {
              "id": "m1",
              "day": 1,
              "title": "Choose the first customer problem",
              "description": "Pick one narrow problem to solve first.",
              "minutes": 20,
              "category": "prepare",
              "done": false,
              "why": "A narrow problem makes the first offer easier to test.",
              "question": "Which problem will you solve first?",
              "suggestions": ["Google Business Profile posts for local salons", "FAQ content for local repair shops", "Short product guides for small online stores"],
              "deliverable": "One saved customer problem",
              "successSignal": "You can describe the customer and problem in one sentence."
            },
            "answer": "FAQ content for local repair shops",
            "priorResults": [],
            "nextMission": {
              "id": "m2",
              "day": 2,
              "title": "Create the first offer",
              "description": "Turn the chosen problem into a simple offer.",
              "minutes": 30,
              "category": "build",
              "done": false
            }
          }
          JSON
          HTTP_CODE=$(curl -sS -o /tmp/mission.json -w '%{http_code}' \
            -X POST "${WORKER_URL}/api/mission/answer" \
            -H 'content-type: application/json' \
            -H "x-device-id: deploy-mission-smoke-${GITHUB_RUN_ID}" \
            --data-binary @/tmp/mission-payload.json)
          cat /tmp/mission.json
          echo
          test "$HTTP_CODE" = "200" || { echo "Mission coaching API returned HTTP $HTTP_CODE"; exit 1; }
          jq -e '.feedback | strings | length > 0' /tmp/mission.json >/dev/null
          jq -e '.refinedOutput | strings | length > 0' /tmp/mission.json >/dev/null
          jq -e '.nextMission.title | strings | length > 0' /tmp/mission.json >/dev/null
          jq -e '.nextMission.description | strings | length > 0' /tmp/mission.json >/dev/null
          jq -e '.nextMission.suggestions | length == 3' /tmp/mission.json >/dev/null
          echo "Interactive mission coaching passed."
          echo "- Interactive mission coaching smoke test: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist D1 binding ID
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore: bind MoneyAction production D1"
            git push origin main
          fi
