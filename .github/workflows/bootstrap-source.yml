name: Bootstrap MoneyAction Source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .bootstrap/part* > /tmp/money-action-source.b64
          base64 -d /tmp/money-action-source.b64 > /tmp/money-action-source.zip
          mkdir -p /tmp/money-action-source
          unzip -q /tmp/money-action-source.zip -d /tmp/money-action-source

      - name: Install source tree
        shell: bash
        run: |
          cp -a /tmp/money-action-source/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import MoneyAction v0.1.1 global beta" || true
          git push

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Sync Capacitor Android
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: money-action-beta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
