name: Bootstrap MoneyAction Source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Bootstrap source and build APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          set -euxo pipefail
          mkdir work && cd work
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

          cat .bootstrap/part0[0-8] > /tmp/money-action-source.b64
          base64 -d /tmp/money-action-source.b64 > /tmp/money-action-source.zip
          mkdir -p /tmp/money-action-source
          unzip -q /tmp/money-action-source.zip -d /tmp/money-action-source -x 'backend/package-lock.json' 'package-lock.json'
          cp -a /tmp/money-action-source/. .
          sed -i 's/node-version: 20/node-version: 22/' .github/workflows/android-debug.yml
          sed -i 's/npm ci/npm install --no-audit --no-fund/' .github/workflows/android-debug.yml
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import MoneyAction v0.1.1 global beta"
          git push origin main

          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
          npm install --no-audit --no-fund
          npm run build
          npm run cap:sync

          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.14.3/bin/gradle -p android assembleDebug --no-daemon

          mkdir -p beta
          cp android/app/build/outputs/apk/debug/app-debug.apk beta/money-action-v0.1.1-debug.apk
          git add -f beta/money-action-v0.1.1-debug.apk
          git commit -m "build: add MoneyAction v0.1.1 debug APK"
          git push origin main
